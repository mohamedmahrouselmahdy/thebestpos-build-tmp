name: Build Windows installer

on:
  push:
    branches: [egypt-edition]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build installer
        run: pnpm tauri build --bundles nsis
      - name: Checksums
        shell: pwsh
        run: |
          $f = Get-ChildItem target/release/bundle/nsis/*.exe
          $f | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $($_.Name)" } | Out-File target/release/bundle/nsis/SHA256SUMS.txt
          Get-Content target/release/bundle/nsis/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TheBestPOS-installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0

  license-tool:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build dzpos-license.exe
        run: cargo build --release -p pos-license-cli
      - name: Checksum
        shell: pwsh
        run: |
          "$((Get-FileHash target/release/dzpos-license.exe -Algorithm SHA256).Hash)  dzpos-license.exe" | Out-File target/release/dzpos-license.sha256.txt
          Get-Content target/release/dzpos-license.sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dzpos-license-tool
          path: |
            target/release/dzpos-license.exe
            target/release/dzpos-license.sha256.txt
          if-no-files-found: error

  tests:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Rust tests (invoice, tax, documents)
        continue-on-error: true
        shell: pwsh
        run: cargo test -p pos-core -p pos-docs --lib 2>&1 | Tee-Object -FilePath rust-tests.log
      - name: Frontend tests
        continue-on-error: true
        shell: pwsh
        run: pnpm exec vitest run 2>&1 | Tee-Object -FilePath vitest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs
          path: |
            rust-tests.log
            vitest.log
